name: Clone source repository once

on:
  push:
    branches:
      - main
    paths:
      - .clone-source-trigger

permissions:
  contents: write

jobs:
  clone-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source and replace destination contents
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/WSLINMSAI/dental-research-ai.git /tmp/dental-research-ai-source
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/clone-source-once.yml' --exclude='.clone-source-trigger' /tmp/dental-research-ai-source/ ./
          rm -f .clone-source-trigger
          rm -f .github/workflows/clone-source-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clone current dental-research-ai main snapshot"
          git push origin HEAD:main
