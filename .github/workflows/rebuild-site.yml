name: Build and deploy GitHub Pages site

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'downloads/**'
      - 'build.py'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/rebuild-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build webpage
        run: python3 build.py

      - name: Prepare public site files
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R downloads _site/downloads

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
